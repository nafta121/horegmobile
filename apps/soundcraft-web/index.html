<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>HOREGDAW</title>
  <link data-trunk rel="icon" type="image/png" href="../../assets/app-icon/hicolor/64x64/apps/ai.storyteller.soundcraft.png" />
  <link data-trunk rel="rust" data-bin="soundcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1f22; touch-action: none; user-select: none; -webkit-user-select: none; }
    #soundcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #soundcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 600 16px system-ui, sans-serif; letter-spacing: 0.08em; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="soundcraft_canvas"></canvas>
  <script>
    // cpal (wasm) builds the output stream at startup, before any user gesture, so the
    // WebAudio AudioContext stays 'suspended': no audio is heard and the transport clock
    // (driven by the audio callback) never advances. Capture the AudioContext cpal creates
    // and resume it on the first user gesture. Runs before the wasm module is instantiated.
    (function () {
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (Orig) {
        var ctxs = [];
        function Wrapped(opts) { var c = new Orig(opts); ctxs.push(c); return c; }
        Wrapped.prototype = Orig.prototype;
        window.AudioContext = Wrapped;
        if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
        function resumeAll() {
          ctxs.forEach(function (c) { if (c.state === 'suspended') { c.resume().catch(function () {}); } });
        }
        ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (ev) {
          window.addEventListener(ev, resumeAll, { capture: true });
        });
      }

      // Bridge blob:// anchor downloads to Android native file saver when running in HOREGDAW APK
      if (window.HoregAndroid && typeof window.HoregAndroid.saveBase64File === 'function') {
        var origClick = HTMLAnchorElement.prototype.click;
        HTMLAnchorElement.prototype.click = function () {
          var href = this.getAttribute('href') || '';
          var downloadName = this.getAttribute('download') || 'session.scraftz';
          if (href.indexOf('blob:') === 0) {
            fetch(href)
              .then(function (r) { return r.blob(); })
              .then(function (blob) {
                var reader = new FileReader();
                reader.onloadend = function () {
                  var res = reader.result || '';
                  var comma = res.indexOf(',');
                  var b64 = comma >= 0 ? res.slice(comma + 1) : res;
                  window.HoregAndroid.saveBase64File(downloadName, blob.type || 'application/octet-stream', b64);
                };
                reader.readAsDataURL(blob);
              })
              .catch(function () {});
            return;
          }
          return origClick.apply(this, arguments);
        };
      }
    })();
  </script>
  <div id="soundcraft_loading">Loading HOREGDAW&hellip;</div>
</body>
</html>
