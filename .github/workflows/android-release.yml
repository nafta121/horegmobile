name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - release
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build & Sign HOREGDAW Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust nightly toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - name: Build, align, and sign HOREGDAW.apk
        run: |
          chmod +x packaging/android/package.sh
          ./packaging/android/package.sh
          cd dist/release
          sha256sum HOREGDAW-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOREGDAW-android-apk
          path: |
            HOREGDAW.apk
            dist/release/HOREGDAW-*.apk
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Determine release tag
        id: meta
        run: |
          VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "HOREGDAW ${{ steps.meta.outputs.tag }} (Android APK)"
          body: |
            ## HOREGDAW ${{ steps.meta.outputs.version }} — Native Android Port
            - **Package ID**: `com.horegdaw.app` (`versionCode` 10000, `versionName` `${{ steps.meta.outputs.version }}`)
            - **Architecture**: `arm64-v8a` (`aarch64-linux-android`, 16 KB page-aligned)
            - **Minimum Android**: Android 8.0+ (`API 26`), Target SDK `35`
            - **Mobile Touch UI/UX**: Cubasis 3–inspired touch interface with top transport & `Bars.Beats.Sub` counter, 15-button action/tool strip (`SEL`, `SPLIT`, `GLUE`, `ERASE`, `DRAW`, `MUTE`, `TRANSP`, `QUANT`, `1/16`, `STRETCH`, `UNDO`, `REDO`, `COPY`, `PASTE`, `# GRID`), collapsible left Track Inspector rail, numbered rainbow track headers, and full-bleed colored clips.
            - **Engine**: Pure-Rust DAW engine (`soundcraft-engine`, `soundcraft-dsp`, `soundcraft-mix`), Android AAudio low-latency playback (`cpal`/`ndk`), and hardware-accelerated `egui`/`wgpu` rendering.
          files: |
            HOREGDAW.apk
            dist/release/HOREGDAW-*.apk
            dist/release/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
